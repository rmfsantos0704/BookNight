name: Process pending bookmarks and digests

on:
  schedule:
    # GitHub's scheduler can't fire more often than every 5 minutes - this
    # is the real floor. scripts/runJobs.js loops internally on top of this
    # for faster effective responsiveness (see that file for why).
    - cron: '*/5 * * * *'
  workflow_dispatch: {} # lets you trigger a run manually from the Actions tab

jobs:
  run-jobs:
    runs-on: ubuntu-latest
    # Safety net: if a run ever somehow takes far longer than expected,
    # this kills it rather than letting it run indefinitely and burning
    # Actions minutes.
    timeout-minutes: 8
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - run: npm ci

      - run: node scripts/runJobs.js
        env:
          MONGO_URI: ${{ secrets.MONGO_URI }}
          EMAIL_HOST: ${{ secrets.EMAIL_HOST }}
          EMAIL_PORT: ${{ secrets.EMAIL_PORT }}
          EMAIL_SECURE: ${{ secrets.EMAIL_SECURE }}
          EMAIL_USER: ${{ secrets.EMAIL_USER }}
          EMAIL_PASS: ${{ secrets.EMAIL_PASS }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}