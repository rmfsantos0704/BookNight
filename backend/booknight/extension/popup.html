<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Booknight</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <div id="loading-view" class="view">
      <p class="muted">Loading…</p>
    </div>

    <div id="login-view" class="view hidden">
      <h1 class="brand">Booknight</h1>
      <form id="login-form">
        <label for="login-email">Email</label>
        <input id="login-email" type="email" required placeholder="you@example.com" />

        <label for="login-password">Password</label>
        <input id="login-password" type="password" required placeholder="••••••••" />

        <p id="login-error" class="error hidden"></p>

        <button id="login-submit" type="submit" class="btn-primary">Sign in</button>
      </form>
    </div>

    <div id="main-view" class="view hidden">
      <div class="tab-info">
        <img id="tab-favicon" alt="" />
        <div class="tab-info-text">
          <p id="tab-title" class="tab-title"></p>
          <p id="tab-url" class="tab-url"></p>
        </div>
      </div>

      <label for="bookmark-title">Title</label>
      <input id="bookmark-title" type="text" placeholder="Bookmark title" />

      <label for="workspace-select">Save to</label>
      <select id="workspace-select"></select>

      <div id="new-workspace-form" class="new-workspace-form hidden">
        <input id="new-workspace-name" type="text" placeholder="Workspace name" />
        <div class="new-workspace-actions">
          <button id="new-workspace-cancel" type="button" class="link-button">Cancel</button>
          <button id="new-workspace-create" type="button" class="btn-secondary">Create</button>
        </div>
        <p id="new-workspace-error" class="error hidden"></p>
      </div>

      <p id="save-error" class="error hidden"></p>
      <p id="save-success" class="success hidden">Saved ✓</p>

      <button id="save-button" class="btn-primary">Save to Booknight</button>

      <div class="footer-row">
        <a id="open-board-link" href="#" target="_blank">Open Booknight</a>
        <button id="logout-button" class="link-button">Sign out</button>
      </div>
    </div>

    <script src="popup.js"></script>
  </body>
</html>
